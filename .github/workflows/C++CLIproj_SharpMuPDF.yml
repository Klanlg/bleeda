name: SharpMuPDF

on:
  workflow_dispatch:
    inputs:
      opencv-version:
        description: dxc
        required: true
        default: 4.5.2

jobs:
  publish_windows_x64:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v6
        with:
            repository: wmjordan/SharpMuPDF
            submodules: recursive
            #fetch-depth: 1
      - name: Visual Studio Development Environment
        uses: TheMrMilchmann/setup-msvc-dev@79dac248aac9d0059f86eae9d8b5bfab4e95e97c # v4.0.0
        with:
          arch: x64
      - name: tocmd
        run: |
          md vin
          msbuild.exe MuPDF.sln /t:Build /p:Configuration=Release;Platform=x64
          rd /s /q .git
          7z a -mqs -m0=lzma -mx=9 -ms=4096m -mf -mfb=64 -md=32m -ms=on D:\arll.7z -ir!*lib -ir!*log -ir!*obj
          move D:\arll.7z vin\
        shell: cmd
      
      
      - name: Upload Windows x64
        uses: actions/upload-artifact@v7
        with:
          name: x64rel
          path: vin\arll.7z
          archive: false
          #if-no-files-found: error
          #include-hidden-files: true

 
